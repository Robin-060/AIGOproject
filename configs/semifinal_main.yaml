  # 冻结预测列 → 实际 checkpoint (按 model_registry.md 纠正)
  PhaseNet:
    checkpoint: geofon        # 冻结列为陆地 geofon, 非 obs (指纹 8/8 验证)
  PickBlue:
    checkpoint: obs           # 冻结列实为 PhaseNet obs
  OBSTransformer:
    checkpoint: obst2024
  EQTransformer:
    checkpoint: obs           # v1.3 新增 (C 批准, 不替换)
  framework_versions:
    seisbench: 0.12.3
    torch: 2.13.0+cpu
    obspy: 1.5.0
  model_prediction_coverage:   # 895 条中有有效预测的记录数（count，不是比例）
    PhaseNet: {P: 125, S: 15}
    PickBlue: {P: 747, S: 827}
    OBSTransformer: {P: 825, S: 881}
    EQTransformer: {P: 753, S: 794}


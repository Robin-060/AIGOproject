# GOAI 赛道三 复赛主实验冻结配置
# 冻结时间: 2026-08-28 (Gate 0) | 冻结人: A (技术冻结权)
# 变更规则: 仅允许"明确 bug 修复"且必须记录版本变更;
#           禁止因结果不理想改动数据/seed/模型/判据/指标。
# v1.1 变更 (2026-08-28 晚): 评价单位按 C 契约 v1.2 改为相位级 Primary;
#       N_eval = 1306; 成对判定降级为 Secondary。参见 evaluation_protocol.md。
# v1.5 变更 (2026-08-31): C 五条建议落地 (收缩版)。
#       ① 置信度 Platt 校准入证据层 (PickBlue/OBSTransformer/EQT;
#          geofon 样本不足保留 raw) — 目的为阈值语义, 不宣称改善排序;
#       ② 分歧单向化: 粗分三级 (SEVERE 满档/MINOR 半档/CONSENSUS 零罚),
#          FUSE 增加校准置信度门槛 (治"抱团一起错");
#       ③ ID-only 域熟悉度门 (马氏距离, XO 阈值 95%=3.94/99%=5.27),
#          DS5 新成功标准 = coverage 主动下降 + retained unsafe 降低;
#       ④ Evidence Admission Rule 制度冻结 (STA/LTA 结案为被拒首例)。
# v1.5.1 变更 (2026-08-31): 审计/复现硬化 + 单一配置; 不改变数据、模型或阈值。
#       ① hydrophone_v2 正式冻结，复现时不再按结果动态选 profile；
#       ② 全部 TrustConfig 参数、随机种子、bootstrap 与运行披露进入单一配置；
#       ③ 当前主结果纠正为 50% NOT_EVALUABLE，天花板 45.64%；
#       ④ 第二域冻结为 _BLANCO，DS5 质量过滤未成立。
#       ⑤ 判据如实留痕: policy_router 第 4.5 步收紧为 fail-closed
#          (共识但无通过全部门槛的融合候选 → 一律 ABSTAIN, 不再回退主模型);
#          本数据集上 1306 单元逐一对齐, 0 个单元决策变化。
# v1.5.1-bugfix 变更 (2026-09-01): ROUTE invalid-pick 明确 bug 修复。
#       rule: 第 3 步选中模型必须具有该相位有效预测, 否则 ABSTAIN
#       (ONLY_SURVIVOR_<model>_NO_VALID_PICK); 原 8 条 ROUTE 中 7 条
#       选中模型无真实拾取, 不得计入 Coverage。修复前 v1.5.1 冻结产物
#       归档于 results/v151_archive/。不改变数据/模型/阈值/判据口径。
config_version: semifinal_v1.5.1-bugfix
parent_config: semifinal_v1.5.1
selected_profile: hydrophone_v2

experiment:
  # 与 selected_profile 必须一致；保留 EXP06 的历史选择程序，但正式复现禁止重选。
  frozen_profile: hydrophone_v2
  profile_selection_history:
    procedure: "main 分片 50% 覆盖率点 Unsafe 更低者胜（预注册准则）"
    decided: hydrophone_v2
    replay: "python -m src.experiments.run_main_experiment --profile-selection"

dataset:
  file: data/batch_calibration/records_all_v2.json
  sha256: e5cc0a28a61a4a919336126cbb6322212292e7ea76de41356fe2e8085fcd2456
  total_records: 895
  chunk_distribution:
    "201805": 116
    "201806": 288
    "201807": 491
  source: seisbench OBS 数据集公开数据, 官方 P/S reference picks
  manifest: data/manifest_phase.csv   # 相位级 (v1.1 起生效; 旧的 data/manifest.csv 为样本级历史版本)

  # ── 评估单位 (v1.1 冻结, C 契约 4.2 节) ──
  evaluation_unit:
    primary: "(sample_id, phase) 相位级 micro 0-1 loss"
    n_eval: 1306          # P 真值 657 + S 真值 649
    p_truth_units: 657
    s_truth_units: 649
    secondary: "成对判定 (P+S 均 correct) 仅用于事件级完整性声明, 不作主指标"
    noise_windows: "已自查 (2026-08-28): 895 条全部有 source_id, 均为事件窗口, 无噪声窗口; 无拾取=正确规则不适用"
    no_pick_rule: "真值要求该相位时 NO_PICK 计错误 (拦截口径); 不进入自动输出"
    cluster_unit: "station (60 个独立台站, 部署 XO) — cluster paired-bootstrap 重采样单元"

  # 留出子集: 稳健性交叉检查用, 不作主结论
  holdout_subset:
    name: holdout_20pct
    definition: 按 chunk 分层 20% 抽样, seed=42 (单元数 358)
    purpose: 主结论在 main 上报告, holdout 作一致性佐证


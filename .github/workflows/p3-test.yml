name: P3 Tests

on:
  push:
    branches:
      - p3-consensus-fusion
  pull_request:
    branches:
      - dev-trust-engine

permissions:
  contents: read

jobs:
  test-p3:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Run P3 consensus and fusion test
        run: python -m src.trust_engine.tests.test_p3_consensus_fusion

name: AIGO CI

on:
  push:
    branches: [integration]
  pull_request:
    branches: [integration]
  workflow_dispatch:

jobs:
  core-smoke:
    name: Core Smoke Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install core dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-core.txt

      - name: Run A-side smoke test
        run: bash smoke_test_a.sh

  full-test:
    name: Full Repository Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install system build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: Install full dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run full smoke test
        run: bash smoke_test.sh

      - name: Check Streamlit syntax
        run: python -m py_compile src/web/app.py

      - name: Start Streamlit and verify HTTP
        run: |
          python -m streamlit run src/web/app.py \
            --server.headless=true \
            --server.address=127.0.0.1 \
            --server.port=8501 > /tmp/streamlit.log 2>&1 &

          for i in {1..30}; do
            if curl -f http://127.0.0.1:8501 >/dev/null 2>&1; then
              echo "Streamlit HTTP OK"
              exit 0
            fi
            sleep 2
          done

          cat /tmp/streamlit.log
          exit 1

services:
  backend:
    build: .
    command:
      - python
      - -m
      - uvicorn
      - src.demo_backend.app:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    ports:
      - "8000:8000"

  web:
    build: .
    command:
      - python
      - -m
      - streamlit
      - run
      - src/web/app.py
      - --server.address=0.0.0.0
      - --server.port=8501
      - --server.headless=true
    ports:
      - "8501:8501"
    depends_on:
      - backend
